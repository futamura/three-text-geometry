name: Sync develop to main

on:
  push:
    branches:
      - develop

# The PR is opened with RELEASE_TOKEN, so GITHUB_TOKEN needs nothing beyond the
# read access actions/checkout uses.
permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create or update PR
        env:
          # GITHUB_TOKEN can only open PRs while the repository's "Allow GitHub
          # Actions to create and approve pull requests" toggle is on. Use the PAT
          # so this workflow does not depend on that setting.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # The post-release back-merge pushes main's commits onto develop, which
          # retriggers this workflow with nothing left to propose.
          AHEAD=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...develop" --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "develop is not ahead of main, nothing to sync"
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists"
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "chore: sync develop to main" \
            --body "$(cat <<'EOF'
          ## Summary

          Automated PR to sync develop branch into main for release.

          ---
          🤖 Generated by the sync-develop-to-main workflow
          EOF
          )"
