name: Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install apt packages for headless-gl
        run: sudo apt update && sudo apt install libxi-dev xvfb libgl1-mesa-dev

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint-check

      - name: Verify release notes rendering
        run: pnpm verify-release-notes

      - name: Verify tree shaking
        run: pnpm verify-tree-shaking

      - name: Verify Node resolution
        run: pnpm verify-node-resolution

      - name: Test
        run: xvfb-run --auto-servernum pnpm test-coverage

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  demo-smoke:
    # Part of tests-result, so branch protection blocks a merge on it through the one check it
    # already requires. It went in outside that gate first and stayed green while the margin it
    # asserts was widened: the floor it compares against was 4.55% and is now 0.84%, which leaves
    # /multipage, the tightest route, at +97% over the bar instead of +15%.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm e2e-install

      # The demo depends on this package through `file:..`, which pnpm copies at install time, so it
      # has to be reinstalled after the library is rebuilt or it keeps running the previous build.
      - name: Build the library
        run: pnpm build

      - name: Install demo dependencies
        run: pnpm install --force
        working-directory: demo

      - name: Build the demo
        run: pnpm build
        working-directory: demo

      - name: Smoke test the demo
        run: pnpm e2e

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  tests-result:
    if: always()
    needs:
      - tests
      - demo-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs['demo-smoke'].result }}" != "success" ]; then
            echo "Demo smoke test failed"
            exit 1
          fi

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version:
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install apt packages for headless-gl
        run: sudo apt update && sudo apt install libxi-dev xvfb libgl1-mesa-dev

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm semantic-release --dry-run
    needs: tests-result
